name: Sync Upstream (Weekly)

on:
  schedule:
    # 每周日北京时间凌晨 03:00 运行 (UTC 19:00 周六)
    - cron: '0 19 * * 6'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # 修正后的参数名如下：
          upstream_sync_repo: shuaiplus/NodeWarden
          upstream_sync_branch: main
          target_sync_branch: main
          test_mode: false

      - name: Check for Failure
        if: failure()
        run: |
          echo "Sync failed! This usually happens if there are major conflicts."
          exit 1
